[project]
name = "mintcap"
version = "0.2.0"
description = "Arduino UNO Q 실내 공기질 모니터링 -- 수집(hub) · 분석(analysis) · 웹(web)"
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.1.0",   # hub.py -- MQTT 구독
    "pandas>=3.0.3",      # analysis -- 파이프라인
    "numpy>=2.0",         # analysis -- 모델 추론(학습된 JSON 만으로)
    "fastapi>=0.115",     # web -- JSON API
    "uvicorn>=0.34",      # web -- ASGI 서버
]

# 학습 전용. 장치에는 설치하지 않는다 -- 판정은 models/*.json 을 읽어
# numpy 로만 수행하므로(analysis/regimes.py, analysis/forecast.py)
# scikit-learn 이 필요 없다.  학습할 때만:  uv sync --group train
[dependency-groups]
train = [
    "scikit-learn>=1.5",
]
